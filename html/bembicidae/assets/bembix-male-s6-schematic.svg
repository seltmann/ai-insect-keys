<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Male Bembix sternite VI schematic</title>
  <desc id="desc">Schematic ventral view showing where sternite VI is located on a male Bembix abdomen, and simplified sternite VI projection shapes.</desc>

  <rect width="1200" height="760" fill="#f7f4ec"/>

  <text x="60" y="58" style="font-family:Arial,Helvetica,sans-serif;font-size:34px;font-weight:700;fill:#1f2328">Male Bembix S6: what to look for</text>
  <text x="60" y="92" style="font-family:Arial,Helvetica,sans-serif;font-size:20px;fill:#6b6256">Ventral view of the metasoma. S6 is the sixth sternite; the useful species character is the posterior projection.</text>

  <rect x="55" y="130" width="420" height="570" rx="8" fill="#fffdf7" stroke="#c8bda7" stroke-width="3"/>
  <text x="85" y="174" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#1f2328">Where S6 sits</text>
  <text x="85" y="203" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#6b6256">Ventral abdomen, posterior end downward</text>

  <ellipse cx="265" cy="284" rx="102" ry="55" fill="none" stroke="#1f2328" stroke-width="3"/>
  <text x="252" y="292" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2328">S2</text>
  <ellipse cx="265" cy="360" rx="94" ry="51" fill="none" stroke="#1f2328" stroke-width="3"/>
  <text x="252" y="368" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2328">S3</text>
  <ellipse cx="265" cy="436" rx="100" ry="53" fill="none" stroke="#1f2328" stroke-width="3"/>
  <text x="252" y="444" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2328">S4</text>
  <ellipse cx="265" cy="512" rx="92" ry="50" fill="none" stroke="#1f2328" stroke-width="3"/>
  <text x="252" y="520" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2328">S5</text>

  <ellipse cx="265" cy="590" rx="92" ry="50" fill="#f3bf45" stroke="#1f2328" stroke-width="4"/>
  <path d="M241 631 L250 666 L265 638 L280 666 L289 631" fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="248" y="599" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#1f2328">S6</text>

  <ellipse cx="265" cy="671" rx="50" ry="37" fill="#d9e7ea" stroke="#1f2328" stroke-width="3"/>
  <text x="252" y="678" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2328">S7</text>

  <path d="M432 570 C398 582 368 600 316 632" fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
  <path d="M315 632 L338 633 L325 612 Z" fill="#1f2328"/>
  <rect x="322" y="525" width="122" height="72" rx="8" fill="#fff7d8" stroke="#9b7616" stroke-width="3"/>
  <text x="340" y="555" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2328">posterior</text>
  <text x="340" y="580" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2328">projection</text>

  <rect x="510" y="130" width="300" height="570" rx="8" fill="#fffdf7" stroke="#c8bda7" stroke-width="3"/>
  <text x="540" y="174" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#1f2328">Forked S6 apex</text>
  <text x="540" y="203" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#6b6256">amoena/sayi route</text>
  <path d="M555 345 C593 310 728 310 765 345 C804 383 802 462 761 503 C719 546 601 546 559 503 C518 462 516 383 555 345 Z" fill="#f8d987" stroke="#1f2328" stroke-width="4" stroke-linejoin="round"/>
  <path d="M620 500 L640 585 L660 536 L680 585 L700 500" fill="none" stroke="#1f2328" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M608 408 C637 389 678 389 707 408" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
  <text x="640" y="436" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#1f2328">S6</text>
  <path d="M755 590 C724 576 695 576 681 582" fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
  <path d="M681 582 L703 589 L698 566 Z" fill="#1f2328"/>
  <text x="618" y="634" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2328">projection split into two tips</text>
  <text x="618" y="661" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#6b6256">if spur is short: compare sayi</text>

  <rect x="845" y="130" width="300" height="570" rx="8" fill="#fffdf7" stroke="#c8bda7" stroke-width="3"/>
  <text x="875" y="174" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#1f2328">Single-pointed S6</text>
  <text x="875" y="203" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#6b6256">americana route</text>
  <path d="M890 345 C928 310 1063 310 1100 345 C1139 383 1137 462 1096 503 C1054 546 936 546 894 503 C853 462 851 383 890 345 Z" fill="#f8d987" stroke="#1f2328" stroke-width="4" stroke-linejoin="round"/>
  <path d="M955 500 L995 585 L1035 500" fill="none" stroke="#1f2328" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M943 408 C972 389 1013 389 1042 408" fill="none" stroke="#1f2328" stroke-width="3" stroke-linecap="round"/>
  <text x="975" y="436" style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;fill:#1f2328">S6</text>
  <path d="M1092 590 C1061 576 1032 576 1014 582" fill="none" stroke="#1f2328" stroke-width="4" stroke-linecap="round"/>
  <path d="M1014 582 L1036 589 L1031 566 Z" fill="#1f2328"/>
  <text x="950" y="634" style="font-family:Arial,Helvetica,sans-serif;font-size:17px;fill:#1f2328">projection tapers to one tip</text>
  <text x="950" y="661" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#6b6256">then check midfemur and clypeus</text>

  <line x1="60" y1="720" x2="1140" y2="720" stroke="#1f2328" stroke-width="2.5" stroke-linecap="round"/>
  <text x="60" y="746" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;fill:#6b6256">Schematic only: use the actual specimen under ventral view. S6 is anterior to S7; do not confuse sternites with dorsal tergites.</text>
</svg>
